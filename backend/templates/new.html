<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Section</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 0px;
            gap: 5px;
        }
        .product {
            position: relative;
            width: 220px;
            height: 300px;
            text-align: center;
            overflow: hidden;
            border-radius: 10px;
        }
        .product img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.6;
        }
        .product div {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 5px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <div class="product">
            <img src="pari.jpg" alt="Leave-in Finder">
            <div>LEAVE-IN FINDER<br>FIND YOUR PERFECT MATCH</div>
        </div>
        <div class="product">
            <img src="jurassic park.png" alt="Cleanse & Condition">
            <div>CLEANSE & CONDITION</div>
        </div>
        <div class="product">
            <img src="Shershaah.jpg" alt="Treat">
            <div>TREAT</div>
        </div>
        <div class="product">
            <img src="Shiddat.jpg" alt="Style">
            <div>STYLE</div>
        </div>
    </div>
</body>
</html>
