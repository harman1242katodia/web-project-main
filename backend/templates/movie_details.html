<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
</head>
<body>
    <h1>{{ movie.title }} ({{ movie.release_year }})</h1>
    <h3>Genre: {{ movie.genre }}</h3>

    <h2>Reviews:</h2>
    {% for review in reviews %}
        <div>
            <strong>{{ review.username }}</strong> — ⭐ {{ review.rating }}/5
            <p>{{ review.comment }}</p>
        </div>
    {% else %}
        <p>No reviews yet. Be the first to review!</p>
    {% endfor %}

    <h2>Add a Review:</h2>
    <form method="POST" action="{{ url_for('add_review', movie_id=movie.id) }}">
        <input type="text" name="username" placeholder="Your Name" required><br>
        <input type="number" name="rating" placeholder="Rating (1-5)" min="1" max="5" required><br>
        <textarea name="comment" placeholder="Write your review..." required></textarea><br>
        <button type="submit">Submit Review</button>
    </form>

    <br><a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
