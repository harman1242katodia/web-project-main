        .gallery-container {
            position: relative;
            overflow: hidden;
            padding: 20px;
            max-width: 90vw;
            margin: auto;

        .image-gallery {
            display: flex;

        .scroll-btn {
            position: absolute;

            border: none;

            border-radius: 50%;

            transition: background 0.3s;

            background: rgba(255, 255, 255, 0.5);

        }

        .scroll-right {
            right: 0;
        }

    <script>
        function toggleWatchlist(button) {
            const movieCard = button.closest(".movie-card");
            const movieName = movieCard.getAttribute("data-movie");
            
            if (localStorage.getItem(`watchlist-${movieName}`)) {
                localStorage.removeItem(`watchlist-${movieName}`);
                button.classList.remove("active");
            } else {
                localStorage.setItem(`watchlist-${movieName}`, true);
                button.classList.add("active");
            }
        }

        function toggleFavorite(button) {
            const movieCard = button.closest(".movie-card");
            const movieName = movieCard.getAttribute("data-movie");
            
            if (localStorage.getItem(`favorite-${movieName}`)) {
                localStorage.removeItem(`favorite-${movieName}`);
                button.classList.remove("active");
            } else {
                localStorage.setItem(`favorite-${movieName}`, true);
                button.classList.add("active");
            }
        }

        document.querySelectorAll(".movie-card").forEach(card => {
            const movieName = card.getAttribute("data-movie");
            const watchlistBtn = card.querySelector(".watchlist-btn");
            const favoriteBtn = card.querySelector(".favorite-btn");

            if (localStorage.getItem(`watchlist-${movieName}`)) {
                watchlistBtn.classList.add("active");
            }
            if (localStorage.getItem(`favorite-${movieName}`)) {
                favoriteBtn.classList.add("active");
            }
        });
    </script>
