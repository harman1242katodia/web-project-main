    <title>Genres</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: left;
            background-color: #252525;
            color: #900505;
        }
        h1 {
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1:hover {
    color: #900505;
    text-shadow: 0px 0px 10px rgba(218, 127, 127, 0.8); /* Subtle glow */
    background: none; /* Ensures no highlight box */
}
        .image-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .image-gallery::-webkit-scrollbar {
            display: none;
        }

        .image-gallery img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
        }

        .image-gallery img:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(255, 255, 255, 0.2);
        }

        .gallery-container {
            position: relative;
            overflow: hidden;
            padding: 20px;
            max-width: 90vw;
            margin: auto;
        }
        .image-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px;
            white-space: nowrap;
        }
        .image-gallery img {
    width: 200px; /* Set a fixed width */
    height: 350px; /* Set a fixed height */
    object-fit: cover; /* Ensures images maintain aspect ratio without distortion */
    border-radius: 10px;
    transition: transform 0.3s ease-in-out;
    position: relative;
}

        .movie-item {
            position: relative;
            display: inline-block;
        }
        .menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 18px;
        }
        .menu {
            display: none;
            position: absolute;
            top: 35px;
            right: 10px;
            background: white;
            color: black;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        .menu button {
            display: block;
            width: 100%;
            border: none;
            background: none;
            padding: 8px 12px;
            text-align: left;
            cursor: pointer;
        }
        .menu button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <script>
        function scrollGallery(id, scrollAmount) {
            document.getElementById(id).scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
    </script>



    <script>
        function toggleMenu(event) {
            event.stopPropagation();
            const menu = event.target.nextElementSibling;
            document.querySelectorAll('.menu').forEach(m => {
                if (m !== menu) m.style.display = 'none';
            });
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        document.addEventListener('click', () => {
            document.querySelectorAll('.menu').forEach(m => m.style.display = 'none');
        });
        function addToWatchlist(movie) {
            alert(${movie} added to Watchlist);
        }
        function addToFavorites(movie) {
            alert(${movie} added to Favorites);
        }
        function watchTrailer(movie) {
            alert(Opening trailer for ${movie});
        }
    </script>
