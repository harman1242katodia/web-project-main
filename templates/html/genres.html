    <style>
         body {
            font-family: Arial, sans-serif;
            text-align: left;
            background-color: #3d3c3c;
            color: #ecdbbb;
        }
        h1 {
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    overflow: hidden;
    white-space: nowrap;
    display: inline-block;
    position: relative;
    transition: color 0.3s ease-in-out, text-shadow 0.3s ease-in-out;
    background: transparent; /* Ensures no background */
}

h1:hover {
    color: #f2c283;
    text-shadow: 0px 0px 10px rgba(246, 175, 82, 0.8); /* Subtle glow */
    background: none; /* Ensures no highlight box */
}

        .gallery-container {
            position: relative;
            overflow: hidden;
            padding: 20px;
            max-width: 90vw;
            margin: auto;
        }

        .image-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .image-gallery::-webkit-scrollbar {
            display: none;
        }

        .image-gallery img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
        }

        .image-gallery img:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(255, 255, 255, 0.2);
        }

        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 18px;
            transition: background 0.3s;
        }

        .scroll-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .scroll-left {
            left: 0;
        }

        .scroll-right {
            right: 0;
        }
    </style>
</head>
