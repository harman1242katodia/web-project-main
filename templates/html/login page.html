<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login page.css">
    <title>Login & Registration</title>
</head>
<body>
    <div class="wrapper">
        <nav class="nav">
            <div class="nav-logo">
                <p>MOVIE MANIA</p>
            </div>
            <div class="nav-menu" id="navMenu">
                <ul>
                    <li><a href="final1.html" class="link">Home</a></li>
                    <li><a href="#" class="link">Blog</a></li>
                    <li><a href="#" class="link">Reviews</a></li>
                    <li><a href="#" class="link">About</a></li>
                </ul>
            </div>
            <div class="nav-button">
                <button class="btn white-btn" id="loginBtn" onclick="login()">Sign In</button>
                <button class="btn" id="registerBtn" onclick="register()">Sign Up</button>
            </div>
            <div class="nav-menu-btn">
                <i class="bx bx-menu" onclick="myMenuFunction()" aria-label="Toggle Navigation Menu"></i>
            </div>
        </nav>

        <div class="form-box">
            <!-- Login Form -->
            <div class="login-container" id="login">
                <div class="top">
                    <span>Don't have an account? <a href="#" onclick="register()">Sign Up</a></span>
                    <header>Login</header>
                </div>
                <div class="input-box">
                    <input type="email" class="input-field" id="login-email" placeholder="Username or Email">
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" id="login-password" placeholder="Password">
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="input-box">
                    <a href="FINALFEEPROJECT1.HTML"> <input type="button" class="submit" value="Sign In" onclick="loginUser()"></a>
                </div>
            </div>
        
            <!-- Registration Form -->
            <div class="register-container" id="register">
                <div class="top">
                    <span>Have an account? <a href="#" onclick="login()">Login</a></span>
                    <header>Sign Up</header>
                </div>
                <div class="two-forms">
                    <div class="input-box">
                        <input type="text" class="input-field" id="register-firstname" placeholder="Firstname">
                        <i class="bx bx-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="text" class="input-field" id="register-lastname" placeholder="Lastname">
                        <i class="bx bx-user"></i>
                    </div>
                </div>
                <div class="input-box">
                    <input type="email'" class="input-field" id="register-email" placeholder="Email">
                    <i class="bx bx-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" id="register-password" placeholder="Password">
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="input-box">
                    <input type="button" class="submit" value="Register" onclick="registerUser()">
                </div>
            </div>
        </div>
    </div>
    <body>
        <video class="background-video" autoplay muted loop>
          <source src="theater.mp4" type="video/mp4">
         
        </video>
      
        <div class="wrapper">
          <div class="form-box">
            <div class="login-container">
              <header>Login Form</header>
              <form action="#">
                <div class="input-box">
                  <input class="input-field" type="email" placeholder="Email">
                </div>
                <div class="input-box">
                  <input class="input-field" type="password" placeholder="Password">
                </div>
                <button type="submit" class="submit">Login</button>
              </form>
            </div>
          </div>
        </div>
      </body>
      
   
      
    <script src="login page.js"></script>
</body>
</html>
